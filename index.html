<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>磁铁画板 · 排料记录器</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #1e1e1e;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: #2a2a2a;
            border-radius: 36px;
            padding: 18px 14px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        .selector-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .size-selector {
            display: flex;
            gap: 8px;
            background: #1f1f1f;
            padding: 6px;
            border-radius: 60px;
            box-shadow: inset 0 2px 5px #0b0b0b;
        }

        .size-btn {
            background: transparent;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #9a9a9a;
            transition: all 0.15s;
            cursor: pointer;
            white-space: nowrap;
        }

        .size-btn.active {
            background: #3d5a80;
            color: white;
            box-shadow: 0 4px 10px rgba(61, 90, 128, 0.5);
        }

        .source-selector {
            display: flex;
            gap: 6px;
            background: #1f1f1f;
            padding: 6px;
            border-radius: 60px;
            box-shadow: inset 0 2px 5px #0b0b0b;
        }

        .source-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.78rem;
            color: #9a9a9a;
            transition: all 0.15s;
            cursor: pointer;
            white-space: nowrap;
        }

        .source-btn.active {
            background: #5a7a3d;
            color: white;
            box-shadow: 0 4px 10px rgba(90, 122, 61, 0.5);
        }

        .piece-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f1f1f;
            padding: 4px 6px;
            border-radius: 50px;
            box-shadow: inset 0 2px 5px #0b0b0b;
        }

        .counter-label {
            color: #b0b0b0;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .counter-value {
            background: #2e2e2e;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #ffd966;
            min-width: 60px;
            text-align: center;
            box-shadow: inset 0 1px 4px #00000066;
        }

        .plus-btn {
            background: #3d5a80;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #1d2e42, 0 6px 12px black;
            transition: all 0.05s linear;
            cursor: pointer;
            transform: translateY(-2px);
            touch-action: manipulation;
        }

        .plus-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1d2e42, 0 4px 8px black;
        }

        .minus-btn {
            background: #5a3d3d;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #3a2626, 0 6px 12px black;
            transition: all 0.05s linear;
            cursor: pointer;
            transform: translateY(-2px);
            touch-action: manipulation;
        }

        .minus-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3a2626, 0 4px 8px black;
        }

        .minus-btn:disabled {
            background: #333;
            box-shadow: 0 6px 0 #1a1a1a, 0 6px 12px black;
            color: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .board-container {
            background: #0f0f0f;
            border-radius: 20px;
            padding: 14px;
            margin: 10px 0 14px;
            box-shadow: inset 0 6px 12px black, 0 8px 16px #00000080;
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .mode-switch {
            display: none;
            flex-direction: column;
            gap: 8px;
            width: 44px;
            flex-shrink: 0;
        }

        .mode-switch.visible {
            display: flex;
        }

        .mode-btn {
            flex: 1;
            background: #2e2e2e;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #9a9a9a;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 2px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 3px;
            transition: all 0.15s;
            min-height: 60px;
            box-shadow: inset 0 -2px 0 #1a1a1a;
        }

        .mode-btn.active[data-mode="initial"] {
            background: #e87a3d;
            color: white;
            border-color: #ff9d5c;
            box-shadow: 0 0 10px rgba(232, 122, 61, 0.6);
        }

        .mode-btn.active[data-mode="usage"] {
            background: #f5c542;
            color: #2a2a2a;
            border-color: #ffd966;
            box-shadow: 0 0 10px rgba(245, 197, 66, 0.6);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            aspect-ratio: 4 / 2;
            width: 100%;
            flex: 1;
            min-width: 0;
        }

        .cell {
            background: #2e2e2e;
            border-radius: 12px;
            box-shadow: inset 0 -4px 0 #1a1a1a, inset 0 2px 8px #00000066, 0 4px 8px black;
            transition: background 0.08s ease, box-shadow 0.08s ease;
            cursor: pointer;
            touch-action: none;
            position: relative;
            border: 1px solid #3a3a3a;
        }

        .cell.initial {
            background: #e87a3d;
            box-shadow: 0 0 12px #e87a3dcc, inset 0 -4px 0 #a04d1a, inset 0 2px 12px #ffb98c;
            border-color: #ff9d5c;
        }

        .cell.highlight {
            background: #f5c542;
            box-shadow: 0 0 16px #f5c542cc, inset 0 -4px 0 #a07d1a, inset 0 2px 12px #ffe28c;
            border-color: #ffd966;
        }

        .options {
            display: flex;
            gap: 16px;
            background: #1f1f1f;
            padding: 14px 16px;
            border-radius: 50px;
            margin: 12px 0 14px;
            box-shadow: inset 0 2px 6px black;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e0e0e0;
            font-weight: 500;
            font-size: 1rem;
            flex: 1;
            cursor: pointer;
        }

        .option-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #3d5a80;
            border-radius: 6px;
            cursor: pointer;
            margin: 0;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .stat-card {
            background: #212121;
            border-radius: 16px;
            padding: 14px 8px;
            flex: 1;
            text-align: center;
            box-shadow: inset 0 3px 6px #00000099, 0 4px 8px black;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9e9e9e;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #f5c542;
            line-height: 1.2;
            word-break: break-word;
        }

        .stat-sub {
            font-size: 0.7rem;
            color: #7a7a7a;
            margin-top: 4px;
        }

        .hint {
            text-align: center;
            color: #6b6b6b;
            font-size: 0.7rem;
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #d9534f;
            color: white;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 9999;
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="top-bar">
            <div class="selector-group">
                <div class="size-selector">
                    <button class="size-btn active" data-size="4x8">4' x 8'</button>
                    <button class="size-btn" data-size="5x10">5' x 10'</button>
                </div>
                <div class="source-selector">
                    <button class="source-btn active" data-source="new">完整新料</button>
                    <button class="source-btn" data-source="scrap">剩料</button>
                    <button class="source-btn" data-source="warehouse">仓库剩料</button>
                </div>
            </div>
            <div class="piece-counter">
                <button class="minus-btn" id="minusBtn" aria-label="减少片数" disabled>−</button>
                <span class="counter-label">片数</span>
                <span class="counter-value" id="pieceCountDisplay">1</span>
                <button class="plus-btn" id="plusBtn" aria-label="增加片数">+</button>
            </div>
        </div>

        <div class="board-container">
            <div class="mode-switch" id="modeSwitch">
                <button class="mode-btn active" data-mode="initial">初始剩料</button>
                <button class="mode-btn" data-mode="usage">使用面积</button>
            </div>
            <div class="grid" id="boardGrid">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
            </div>
        </div>

        <div class="options">
            <label class="option-item">
                <input type="checkbox" id="returnWarehouseCheckbox"> 放回仓库
            </label>
            <label class="option-item">
                <input type="checkbox" id="scrapAreaCheckbox" checked> 剩料区
            </label>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">用了</div>
                <div class="stat-value" id="usedArea">0.00</div>
                <div class="stat-sub">平方英尺</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">放回</div>
                <div class="stat-value" id="returnArea">0.00</div>
                <div class="stat-sub">平方英尺</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">剩料</div>
                <div class="stat-value" id="scrapArea">0.00</div>
                <div class="stat-sub">平方英尺</div>
            </div>
        </div>

        <div class="hint">每个格子独立切换 · 剩余面积归入选中的去向</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const SIZES = {
                '4x8': 32,
                '5x10': 50
            };

            let currentSize = '4x8';
            let currentSource = 'new';
            let editMode = 'initial';
            let pieceCount = 1;
            let highlights = new Array(8).fill(false);
            let usageMarks = new Array(8).fill(false);

            const cells = document.querySelectorAll('.cell');
            const sizeBtns = document.querySelectorAll('.size-btn');
            const sourceBtns = document.querySelectorAll('.source-btn');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const modeSwitch = document.getElementById('modeSwitch');
            const pieceCountDisplay = document.getElementById('pieceCountDisplay');
            const plusBtn = document.getElementById('plusBtn');
            const minusBtn = document.getElementById('minusBtn');
            const usedAreaEl = document.getElementById('usedArea');
            const returnAreaEl = document.getElementById('returnArea');
            const scrapAreaEl = document.getElementById('scrapArea');
            const returnWarehouseCheckbox = document.getElementById('returnWarehouseCheckbox');
            const scrapAreaCheckbox = document.getElementById('scrapAreaCheckbox');
            const toast = document.getElementById('toast');

            function isScrapMode() {
                return currentSource === 'scrap' || currentSource === 'warehouse';
            }

            function recalc() {
                const boardArea = SIZES[currentSize];
                const pieceArea = boardArea / 8;

                // 剩料模式 + 初始剩料模式 → 三个框全 0
                if (isScrapMode() && editMode === 'initial') {
                    usedAreaEl.textContent = '0.00';
                    returnAreaEl.textContent = '0.00';
                    scrapAreaEl.textContent = '0.00';
                    return;
                }

                let usedCount, remainCount;

                if (isScrapMode()) {
                    // 使用面积模式
                    const initialCount = highlights.filter(Boolean).length;
                    const usageCount = usageMarks.filter(Boolean).length;
                    usedCount = usageCount;
                    remainCount = initialCount - usageCount;
                } else {
                    const c = highlights.filter(Boolean).length;
                    usedCount = c;
                    remainCount = 8 - c;
                }

                const usedArea = usedCount * pieceArea * pieceCount;
                let remainingArea = remainCount * pieceArea * pieceCount;

                // 启动逻辑：没有使用 → 剩余不启动
                if (isScrapMode()) {
                    if (usageMarks.filter(Boolean).length === 0) {
                        remainingArea = 0;
                    }
                } else {
                    if (usedCount === 0) {
                        remainingArea = 0;
                    }
                }

                let returnArea = 0;
                let scrapArea = 0;

                if (returnWarehouseCheckbox.checked) {
                    returnArea = remainingArea;
                } else if (scrapAreaCheckbox.checked) {
                    scrapArea = remainingArea;
                }

                usedAreaEl.textContent = usedArea.toFixed(2);
                returnAreaEl.textContent = returnArea.toFixed(2);
                scrapAreaEl.textContent = scrapArea.toFixed(2);
            }

            function renderHighlights() {
                cells.forEach((cell, i) => {
                    if (isScrapMode()) {
                        const isInitial = highlights[i];
                        const isUsage = usageMarks[i] && highlights[i];
                        cell.classList.toggle('initial', isInitial && !isUsage);
                        cell.classList.toggle('highlight', isUsage);
                    } else {
                        cell.classList.remove('initial');
                        cell.classList.toggle('highlight', highlights[i]);
                    }
                });
            }

            function updatePieceDisplay() {
                pieceCountDisplay.textContent = pieceCount;
                minusBtn.disabled = (pieceCount <= 1);
            }

            function updateModeSwitchVisibility() {
                if (isScrapMode()) {
                    modeSwitch.classList.add('visible');
                } else {
                    modeSwitch.classList.remove('visible');
                }
            }

            function toggleCell(idx) {
                if (idx < 0 || idx > 7) return;

                if (isScrapMode()) {
                    if (editMode === 'initial') {
                        highlights[idx] = !highlights[idx];
                        if (!highlights[idx]) {
                            usageMarks[idx] = false;
                        }
                    } else {
                        if (!highlights[idx]) return;
                        usageMarks[idx] = !usageMarks[idx];
                    }
                } else {
                    highlights[idx] = !highlights[idx];
                }

                renderHighlights();
                recalc();
            }

            let toastTimer = null;
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            function checkOverflow() {
                if (!isScrapMode()) return;
                if (editMode !== 'initial') return;

                const count = highlights.filter(Boolean).length;
                if (count >= 8) {
                    highlights[4] = false;
                    usageMarks[4] = false;
                    renderHighlights();
                    recalc();
                    showToast('剩料不能覆盖整片，已自动移除左下角一格');
                }
            }

            let isPointerDown = false;
            let lastIndex = -1;
            let touchedThisDrag = new Set();

            function getCellIndexAt(x, y) {
                const el = document.elementFromPoint(x, y);
                if (!el) return -1;
                const cell = el.closest('.cell');
                if (!cell) return -1;
                const idx = parseInt(cell.dataset.index, 10);
                return isNaN(idx) ? -1 : idx;
            }

            function onDown(e) {
                const cell = e.target.closest('.cell');
                if (!cell) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (e.pointerType === 'touch' && !e.isPrimary) return;

                e.preventDefault();

                const idx = parseInt(cell.dataset.index, 10);
                if (isNaN(idx)) return;

                isPointerDown = true;
                touchedThisDrag = new Set();

                toggleCell(idx);
                touchedThisDrag.add(idx);
                lastIndex = idx;
            }

            function onMove(e) {
                if (!isPointerDown) return;
                e.preventDefault();

                const idx = getCellIndexAt(e.clientX, e.clientY);
                if (idx === -1) {
                    lastIndex = -1;
                    return;
                }
                if (idx === lastIndex) return;
                lastIndex = idx;
                if (touchedThisDrag.has(idx)) return;

                toggleCell(idx);
                touchedThisDrag.add(idx);
            }

            function onUp() {
                if (!isPointerDown) return;
                isPointerDown = false;
                lastIndex = -1;
                touchedThisDrag = new Set();
                checkOverflow();
            }

            returnWarehouseCheckbox.addEventListener('change', () => {
                if (returnWarehouseCheckbox.checked) {
                    scrapAreaCheckbox.checked = false;
                } else {
                    returnWarehouseCheckbox.checked = true;
                }
                recalc();
            });

            scrapAreaCheckbox.addEventListener('change', () => {
                if (scrapAreaCheckbox.checked) {
                    returnWarehouseCheckbox.checked = false;
                } else {
                    scrapAreaCheckbox.checked = true;
                }
                recalc();
            });

            function init() {
                sizeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const size = btn.dataset.size;
                        if (size === currentSize) return;
                        sizeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentSize = size;
                        recalc();
                    });
                });

                sourceBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const src = btn.dataset.source;
                        if (src === currentSource) return;
                        sourceBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentSource = src;

                        pieceCount = 1;
                        updatePieceDisplay();

                        editMode = 'initial';
                        modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === 'initial'));

                        usageMarks = new Array(8).fill(false);

                        updateModeSwitchVisibility();
                        renderHighlights();
                        recalc();

                        checkOverflow();
                    });
                });

                modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mode = btn.dataset.mode;
                        if (mode === editMode) return;
                        modeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        editMode = mode;
                        recalc();
                    });
                });

                plusBtn.addEventListener('click', () => {
                    pieceCount++;
                    updatePieceDisplay();
                    recalc();
                });

                minusBtn.addEventListener('click', () => {
                    if (pieceCount <= 1) return;
                    pieceCount--;
                    updatePieceDisplay();
                    recalc();
                });

                const grid = document.getElementById('boardGrid');
                grid.addEventListener('pointerdown', onDown);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);

                grid.addEventListener('touchstart', (e) => {
                    if (e.target.closest('.cell')) e.preventDefault();
                }, { passive: false });

                grid.addEventListener('dragstart', (e) => e.preventDefault());

                renderHighlights();
                updatePieceDisplay();
                updateModeSwitchVisibility();
                recalc();
            }

            init();
        })();
    </script>
</body>
</html>
